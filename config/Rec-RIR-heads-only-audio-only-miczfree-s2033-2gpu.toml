# A3 audio-only control on locked miczfree-s2033 corpus.
# Same recipe as final model but use_film=false / use_room_conditioning=false.
# Early-stop ~ep40 OK (epochs=42). Warm-start vendor epoch35 trunk.
#
# Usage (2×Ada DDP):
#   CUDA_VISIBLE_DEVICES=0,1 torchrun --standalone --nnodes=1 --nproc_per_node=2 train.py \
#     -c config/Rec-RIR-heads-only-audio-only-miczfree-s2033-2gpu.toml \
#     -p /storage/reie/experiments/a3-audio-only-miczfree-s2033 \
#     -s /storage/reie/REC-RIR-LOCALIZATION/ckpt/epoch35.tar

[meta]
seed = 2024
cudnn_enable = true
use_torch_compile = false

[wandb]
project = "rec-rir-localization"
entity = ""
name = "a3-audio-only-miczfree-s2033"
tags = ["training", "rec-rir", "audio-only", "no-film", "miczfree", "s2033", "volume-drop", "7d", "edge-mic", "y0-band", "w09", "ada", "2gpu", "a3"]
notes = "A3 audio-only control: no FiLM, same miczfree-s2033 data/recipe as paper final. Early-stop ~ep40."
mode = "offline"

[acoustic]
path = "acoustics.feature.transforms"

[dataloader]
path = "dataset.dataset_RecRIR.MyDataloader"

[optimizer]
type = "AdamW"

[scheduler]
type = "CosineAnnealingLR"

[trainer]
path = "trainer_inferencer.trainer_RecRIR.Trainer"

[model]
path = "model.RecRIR.BiSpatialNet"

[EM_algo]
path = "method.pim.PIM"

[acoustic.args]
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
win_type = "sqrthann"

[dataloader.args]
src_pathlist = [ "config/reie_train_speech_quick.txt", "config/reie_validation_speech_quick.txt", "config/reie_validation_speech_quick.txt",]
rir_pathlist = [ "config/rir-uniform-angle-fullroom-edge-y0-band-min03-ow02-w09-miczfree-s2033/reie-train-rir.txt", "config/rir-uniform-angle-fullroom-edge-y0-band-min03-ow02-w09-miczfree-s2033/reie-validation-rir.txt", "config/rir-uniform-angle-fullroom-edge-y0-band-min03-ow02-w09-miczfree-s2033/reie-test-rir.txt",]
noise_pathlist = [ "config/reie_train_noise.txt", "config/reie_train_noise.txt", "config/reie_train_noise.txt",]
localization_csv = "/storage/reie/data/rec-rir/rir-uniform-angle-fullroom-edge-y0-band-min03-ow02-w09-miczfree-s2033/rir_localization.csv"
localization_csv_columns = [ "rir_path", "angle_deg", "radius_m",]
num_angles = 181
max_rad_value = 13.0
rad_resolution = 0.25
snr_range = [ 5, 20,]
seq_lenlist = [ 4.0, 6.0, 4.0,]
batchsize = [ 2, 2, 1,]
num_workers = 0
seeds = [ 2022, 2023, 2024,]
pin_memory = true
prefetch_factor = 1
persistent_workers = false
rank = 0
sr = 16000
noisy_proportion = 1
use_room_conditioning = false
volume_mode = "drop"

[optimizer.args]
lr = 0.0005

[scheduler.args]
T_max = 279_942
eta_min = 1e-6

[trainer.train]
epochs = 42
clip_grad_norm_value = 1
save_ckpt_interval = 5
loss_w_cln = 1.0
loss_w_rvb = 1.0
loss_w_rec = 1.0
loss_w_angle = 1.0
loss_w_radius = 1.0
loss_type = "RIMag"
angle_label_smoothing_sigma = 10.0
radius_label_smoothing_sigma = 2.0
retain_graph = true

[trainer.validation]
interval = 1
save_max_metric = false
best_metric = "localization"
best_metric_radius_weight = 10.0

[model.args]
dim_input = 2
dim_output_spch = 2
dim_output_CTF = 120
dim_hidden = 96
dim_squeeze = 8
num_freqs = 257
num_layers_spch = 6
num_layers_noise = 2
num_layers_CTF = 6
num_angles = 181
max_rad_value = 13.0
rad_resolution = 0.25
encoder_kernel_size = 5
dropout = [ 0, 0, 0,]
kernel_size = [ 5, 3,]
conv_groups = [ 8, 8,]
norms = [ "LN", "LN", "LN", "LN", "LN", "LN",]
full_share = 0
attention = "mamba(16,4)"
use_film = false
num_room_params = 7
embedding_type = "1dconv"
embedding_1dconv_kernel = 5
use_film_ctf_layers = false
film_ctf_layer_indices = [ 0, 1, 2, 3, 4, 5,]
film_identity_init = false

[EM_algo.args]
sr = 16000
