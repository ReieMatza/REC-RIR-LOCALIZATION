[meta]
seed = 2024
cudnn_enable = true
use_torch_compile = false  # Set to false to reduce memory usage

[wandb]
project = "rec-rir-localization"
entity = ""  # WandB team/entity (optional, leave empty for personal account)
name = ""  # Run name (optional, will auto-generate if empty)
tags = ["training", "rec-rir"]
notes = ""
mode = "online"  # "online", "offline", or "disabled"

[acoustic]
path = "acoustics.feature.transforms"

[dataloader]
path = "dataset.dataset_RecRIR.MyDataloader"

[optimizer]
type = "AdamW"

[scheduler]
type = "CosineAnnealingWarmRestarts"

[trainer]
path = "trainer_inferencer.trainer_RecRIR.Trainer"

[model]
path = "model.RecRIR.BiSpatialNet"

[EM_algo]
path = "method.pim.PIM"

[acoustic.args]
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
win_type = "sqrthann"

[dataloader.args]
src_pathlist = [ "config/reie_train_speech_quick.txt", "config/reie_validation_speech_quick.txt", "config/reie_validation_speech_quick.txt",]
rir_pathlist = [ "config/w-localization/reie-train-rir.txt", "config/w-localization/reie-validation-rir.txt", "config/w-localization/reie-validation-rir.txt",]
noise_pathlist = [ "config/reie_train_noise.txt", "config/reie_train_noise.txt", "config/reie_train_noise.txt",]
localization_csv = "/storage/reie/data/rec-rir/rir-w-localization/rir_localization.csv"
localization_csv_columns = [ "rir_path", "angle_deg", "radius_m",]
num_angles = 360
max_rad_value = 3.0
rad_resolution = 0.1
snr_range = [ 5, 20,]
seq_lenlist = [ 4.0, 6.0, 4.0,]
batchsize = [ 2, 2, 1,]
num_workers = 8
seeds = [ 2022, 2023, 2024,]
pin_memory = true
prefetch_factor = 1
persistent_workers = true
rank = 0
sr = 16000
noisy_proportion = 1

[optimizer.args]
lr = 0.001

[scheduler.args]
T_0 = 24272 # depend on the samples in one epoch

[trainer.train]
epochs = 100
clip_grad_norm_value = 1
save_ckpt_interval = 1
loss_w_cln = 1
loss_w_rvb = 1
loss_w_rec = 1
loss_w_angle = 1.0
loss_w_radius = 1.0
loss_type = "RIMag"

[trainer.validation]
interval = 1
save_max_metric = false

[model.args]
dim_input = 2
dim_output_spch = 2
dim_output_CTF = 120
dim_hidden = 96
dim_squeeze = 8
num_freqs = 257
num_layers_spch = 6
num_layers_noise = 2
num_layers_CTF = 6
num_angles = 360
max_rad_value = 3.0
rad_resolution = 0.1
encoder_kernel_size = 5
dropout = [ 0, 0, 0,]
kernel_size = [ 5, 3,]
conv_groups = [ 8, 8,]
norms = [ "LN", "LN", "LN", "LN", "LN", "LN",]
full_share = 0
attention = "mamba(16,4)"

[EM_algo.args]
sr = 16000
